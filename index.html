<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjaswa Ateliers — Something Beautiful is Coming Home</title>

  <!-- SEO & Social Meta Tags -->
  <meta name="description"
    content="Anjaswa Ateliers — Our new collection of bespoke furniture and interior pieces is coming soon. Chat with us on WhatsApp for pre-launch enquiries.">
  <meta name="keywords"
    content="Anjaswa Ateliers, furniture, interior studio, luxury furniture, home decor, modern sofa, dining table, bespoke interiors">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://anjaswaateliers.com/">
  <meta property="og:title" content="Anjaswa Ateliers — Launching Soon">
  <meta property="og:description"
    content="Something beautiful is coming home. Our new collection of artisanal furniture is on its way.">
  <meta property="og:image" content="./assets/categories/sofas.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anjaswa Ateliers — Launching Soon">
  <meta name="twitter:description"
    content="Something beautiful is coming home. Our new collection of artisanal furniture is on its way.">
  <meta name="twitter:image" content="./assets/categories/sofas.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">

  <!-- Google Fonts: Fraunces & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=swap"
    rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Layered Animated Background Elements -->
  <div class="bg-glow-container" aria-hidden="true">
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>
  </div>

  <!-- Subtle Linen/Paper Grain Noise Filter -->
  <div class="bg-grain-overlay" aria-hidden="true">
    <svg class="noise-svg">
      <filter id="paper-noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#paper-noise)" opacity="0.045" />
    </svg>
  </div>

  <!-- Single Viewport Page Wrapper -->
  <div class="page-wrapper">

    <!-- Top Header & Logo -->
    <header class="site-header fade-in-up" style="--delay: 0.05s;">
      <a href="#" class="logo-link" aria-label="Anjaswa Ateliers Home">
        <div class="logo-container">
          <img id="brand-logo" src="./assets/logo.png" alt="Anjaswa Ateliers" class="brand-logo">
        </div>
      </a>
    </header>

    <!-- Main Viewport Content -->
    <main class="main-content">

      <!-- Text & Hero Area -->
      <section class="hero-section">
        <p id="eyebrow" class="eyebrow fade-in-up" style="--delay: 0.15s;">LAUNCHING SOON</p>
        <h1 id="headline" class="headline fade-in-up" style="--delay: 0.25s;">Something beautiful is coming home.</h1>
        <p id="supporting-text" class="supporting-text fade-in-up" style="--delay: 0.35s;">
          Our new collection of furniture is on its way. For enquiries, chat with us on WhatsApp.
        </p>
      </section>

      <!-- Optional Countdown Block -->
      <section id="countdown-section" class="countdown-section fade-in-up" style="--delay: 0.4s;">
        <div class="countdown-container" id="countdown-container" aria-label="Launch countdown timer">
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-days">00</span>
            <span class="countdown-label" id="label-days">Days</span>
          </div>
          <span class="countdown-colon">:</span>
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-hours">00</span>
            <span class="countdown-label" id="label-hours">Hours</span>
          </div>
          <span class="countdown-colon">:</span>
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-mins">00</span>
            <span class="countdown-label" id="label-mins">Mins</span>
          </div>
          <span class="countdown-colon">:</span>
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-secs">00</span>
            <span class="countdown-label" id="label-secs">Secs</span>
          </div>
        </div>
      </section>

      <!-- Primary Action: WhatsApp CTA -->
      <div class="cta-wrapper fade-in-up" style="--delay: 0.45s;">
        <a id="main-cta-btn"
          href="https://wa.me/917976011838?text=Hi%20Anjaswa%20Ateliers%2C%20I%20would%20like%20to%20know%20more%20about%20your%20furniture."
          target="_blank" rel="noopener noreferrer" class="btn-whatsapp-primary" aria-label="Chat on WhatsApp">
          <!-- Official WhatsApp Glyph Inline SVG -->
          <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"
            fill="#FFFFFF">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.99c-.002 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.05 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
          </svg>
          <span id="cta-button-text">Chat on WhatsApp</span>
        </a>
      </div>

    </main>

    <!-- Full-Width 100vw Category Showcase Marquee (Edge to Edge) -->
    <section class="category-showcase fade-in-up" style="--delay: 0.55s;" aria-label="Furniture Category Showcase">

      <!-- Mask overlay for soft edge fade -->
      <div class="marquee-mask left"></div>
      <div class="marquee-mask right"></div>

      <!-- Marquee Row 1 (Scrolls Left) -->
      <div class="marquee-row marquee-row-1">
        <div class="marquee-track track-left" id="marquee-track-1">
          <!-- Cards populated dynamically -->
        </div>
      </div>

      <!-- Marquee Row 2 (Scrolls Right) -->
      <div class="marquee-row marquee-row-2">
        <div class="marquee-track track-right" id="marquee-track-2">
          <!-- Cards populated dynamically -->
        </div>
      </div>

    </section>

    <!-- Site Footer -->
    <footer class="site-footer fade-in-up" style="--delay: 0.65s;">
      <div class="footer-content">
        <!-- Instagram Link -->
        <a id="instagram-link" href="https://instagram.com/anjaswaateliers" target="_blank" rel="noopener noreferrer"
          class="social-link" aria-label="Visit Anjaswa Ateliers on Instagram">
          <svg class="instagram-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <p id="copyright" class="copyright-text">© 2026 Anjaswa Ateliers. All rights reserved.</p>
      </div>
    </footer>

  </div>

  <!-- Floating WhatsApp Quick Button (Bottom Right) -->
  <a id="floating-whatsapp-btn"
    href="https://wa.me/917976011838?text=Hi%20Anjaswa%20Ateliers%2C%20I%20would%20like%20to%20know%20more%20about%20your%20furniture."
    target="_blank" rel="noopener noreferrer" class="floating-whatsapp" aria-label="Chat with us on WhatsApp">
    <span class="pulse-ring"></span>
    <svg class="whatsapp-floating-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
      fill="#FFFFFF">
      <path
        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.99c-.002 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.05 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" />
    </svg>
  </a>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>

</html>
